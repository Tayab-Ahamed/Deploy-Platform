events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── API server ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.localhost;

        location / {
            proxy_pass         http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;      # allow long build uploads
            client_max_body_size 128m;
        }
    }

    # ── React dashboard ───────────────────────────────────────────────
    server {
        listen 80;
        server_name app.localhost;

        location / {
            proxy_pass         http://host.docker.internal:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";   # needed for Vite HMR
            proxy_set_header   Host       $host;
        }
    }

    # ── Deployed apps — wildcard *.apps.localhost ──────────────────────
    # Each app gets its own subdomain routed to the k3s ingress controller
    server {
        listen 80;
        server_name ~^(?<subdomain>[a-z0-9-]+)\.apps\.localhost$;

        location / {
            # k3s nginx-ingress listens on NodePort 30080
            proxy_pass         http://127.0.0.1:30080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $subdomain.localhost;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ── Default — catch-all redirect to dashboard ─────────────────────
    server {
        listen 80 default_server;
        return 301 http://app.localhost$request_uri;
    }
}
